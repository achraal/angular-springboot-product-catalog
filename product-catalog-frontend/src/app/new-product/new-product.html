<div class="container mt-3 col-md-6">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h3 class="mb-0">Ajouter un Produit</h3>
    </div>
    <div class="card-body">
      <form [formGroup]="productForm" (ngSubmit)="handleSaveProduct()">
        <div class="mb-3">
          <label class="form-label">Nom du Produit</label>
          <input type="text" class="form-control" formControlName="name">
        </div>
        <div class="mb-3">
          <label class="form-label">Prix (€)</label>
          <input type="number" class="form-control" formControlName="price">
        </div>
        <div class="form-check mb-3">
          <input type="checkbox" class="form-check-input" id="selected" formControlName="selected">
          <label class="form-check-label" for="selected">Sélectionné par défaut</label>
        </div>
        <button type="submit" [disabled]="productForm.invalid" class="btn btn-success me-2">
          <i class="bi bi-check-lg"></i> Enregistrer
        </button>
        <button type="button" class="btn btn-secondary" routerLink="/products">Annuler</button>
      </form>
    </div>
  </div>
</div>
